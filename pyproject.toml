[project]
name = "simulator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "altair>=5.0.0",
    "anywidget>=0.11.0",
    "hssm>=0.4.0",
    "ssm-simulators>=0.13.2",
    "marimo>=0.21.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = ["slow: computationally intensive real HSSM fits; run with -m slow"]
